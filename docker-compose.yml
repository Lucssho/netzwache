services:
  db:
    image: postgres:16-alpine
    container_name: netzwache-db
    environment:
      POSTGRES_USER: netzwache
      POSTGRES_PASSWORD: netzwache
      POSTGRES_DB: netzwache
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"          # 5433 lokal, damit ein lokales Postgres nicht kollidiert
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netzwache"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: netzwache-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: netzwache-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://netzwache:netzwache@db:5432/netzwache
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: netzwache-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
